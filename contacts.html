<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پخش مخاطبین - حساب‌کتاب من</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap');

    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #059669;
      --primary-gradient: linear-gradient(135deg, #047857 0%, #059669 100%);
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* پنجره ورود ایمیل اختصاصی کاربر */
    #authOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .auth-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-dark);
    }

    .auth-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
    }

    .back-link {
      text-decoration: none;
      color: var(--primary);
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-badge {
      font-size: 11px;
      background: #d1fae5;
      color: #065f46;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .form-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--primary);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      outline: none;
      background: #f8fafc;
    }

    .form-input:focus { border-color: var(--primary); background: #fff; }

    .btn-submit {
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .contacts-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 900;
      color: var(--text-dark);
    }

    .contact-details {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .eng-text {
      font-family: Tahoma, sans-serif;
      direction: ltr;
      display: inline-block;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      border-top: 1px solid #f1f5f9;
      padding-top: 10px;
    }

    .action-btn {
      padding: 8px 2px;
      border-radius: 10px;
      border: none;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      text-align: center;
    }

    .btn-whatsapp { background: #dcfce7; color: #16a34a; }
    .btn-sms { background: #e0f2fe; color: #0284c7; }
    .btn-call { background: #fef3c7; color: #d97706; }
    .btn-edit { background: #f1f5f9; color: #475569; }
    .btn-delete { background: #fee2e2; color: #dc2626; }

    .loading-box { text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>

  <!-- پنجره ورود ایمیل اختصاصی کاربر -->
  <div id="authOverlay" style="display:none;">
    <div class="auth-card">
      <div class="auth-title">ورود به حساب کاربری</div>
      <div class="auth-desc">لطفاً ایمیل خود را وارد کنید تا مخاطبین مختص حساب شما بارگذاری شوند.</div>
      <input type="email" id="userEmailInput" class="form-input eng-text" placeholder="your-email@gmail.com">
      <button class="btn-submit" onclick="saveUserEmail()">ورود و مشاهده مخاطبین</button>
    </div>
  </div>

  <div class="app-viewport">
    
    <div class="header-nav">
      <a href="index.html" class="back-link">← بازگشت به منو</a>
      <span id="currentUserDisplay" class="user-badge">کاربر: --</span>
    </div>

    <div class="form-card">
      <span class="form-title" id="formTitle">➕ افزودن مخاطب جدید</span>
      <input type="hidden" id="editRowIndex" value="">
      
      <div class="input-group">
        <span class="input-label">نام و نام خانوادگی:</span>
        <input type="text" id="nameInput" class="form-input" placeholder="مثلاً احمد کریمی">
      </div>

      <div class="input-group">
        <span class="input-label">شماره تماس (با کد کشور و علامت + همراه باشد):</span>
        <input type="text" id="phoneInput" class="form-input eng-text" placeholder="+9647700000000">
      </div>

      <button class="btn-submit" onclick="saveContact()" id="submitBtn">ذخیره مخاطب</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" class="form-input" placeholder="🔍 جستجو بر اساس نام مخاطب..." oninput="filterContacts()">
    </div>

    <div id="contactsList" class="contacts-container">
      <div class="loading-box">در حال بارگذاری اطلاعات...</div>
    </div>

  </div>

  <script>
    // لینک جدید وب‌اپلیکیشن گوگل اسکریپت شما
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCmD0ZbWKzvXIkahzoU81l-bOGmS75eHJ2Xo_netxIIFY8aCDtjAsaNLrkn4HFFQYj/exec";
    
    let allContacts = [];
    let currentUserEmail = localStorage.getItem('hesab_user_email') || "";

    window.onload = function() {
      if (!currentUserEmail) {
        document.getElementById('authOverlay').style.display = 'flex';
      } else {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('currentUserDisplay').innerText = currentUserEmail;
        loadContacts();
      }
    };

    function saveUserEmail() {
      const email = document.getElementById('userEmailInput').value.trim();
      if (!email || !email.includes('@')) {
        alert("لطفاً یک ایمیل معتبر وارد کنید.");
        return;
      }
      localStorage.setItem('hesab_user_email', email);
      currentUserEmail = email;
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('currentUserDisplay').innerText = email;
      loadContacts();
    }

    function loadContacts() {
      const container = document.getElementById('contactsList');
      container.innerHTML = '<div class="loading-box">در حال دریافت اطلاعات از گوگل شیت...</div>';

      fetch(`${SCRIPT_URL}?action=read&email=${encodeURIComponent(currentUserEmail)}`)
        .then(res => res.json())
        .then(data => {
          allContacts = data || [];
          renderContacts(allContacts);
        })
        .catch(err => {
          container.innerHTML = '<div class="loading-box" style="color: #dc2626;">خطا در ارتباط با گوگل شیت!</div>';
        });
    }

    function renderContacts(list) {
      const container = document.getElementById('contactsList');
      container.innerHTML = "";
      
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="loading-box">هیچ مخاطبی یافت نشد.</div>';
        return;
      }

      list.forEach(item => {
        let rawPhone = item.phone ? item.phone.toString().trim() : '';
        let cleanWhatsAppPhone = rawPhone.replace(/[^0-9]/g, '');
        
        let card = document.createElement('div');
        card.className = 'contact-card';
        card.innerHTML = `
          <div class="contact-info">
            <div>
              <div class="contact-name">${item.name || 'بدون نام'}</div>
              <div class="contact-details eng-text">📞 ${item.phone || '-'}</div>
            </div>
          </div>
          <div class="actions-grid">
            <a href="https://wa.me/${cleanWhatsAppPhone}" target="_blank" class="action-btn btn-whatsapp">
              <span>💬</span> واتساپ
            </a>
            <a href="sms:${rawPhone}" class="action-btn btn-sms">
              <span>📱</span> پیامک
            </a>
            <a href="tel:${rawPhone}" class="action-btn btn-call">
              <span>📞</span> تماس
            </a>
            <button class="action-btn btn-edit" onclick="prepareEdit(${item.row}, '${item.name || ''}', '${item.phone || ''}')">
              <span>✏️</span> ویرایش
            </button>
            <button class="action-btn btn-delete" onclick="deleteContact(${item.row})">
              <span>🗑️</span> حذف
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterContacts() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allContacts.filter(c => c.name && c.name.toLowerCase().includes(query));
      renderContacts(filtered);
    }

    function saveContact() {
      const row = document.getElementById('editRowIndex').value;
      const name = document.getElementById('nameInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();

      if (!name || !phone) {
        alert("لطفاً نام و شماره تماس را وارد کنید.");
        return;
      }

      const action = row ? "edit" : "add";
      let url = `${SCRIPT_URL}?action=${action}&email=${encodeURIComponent(currentUserEmail)}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;
      if (row) {
        url += `&row=${row}`;
      }

      document.getElementById('submitBtn').innerText = "در حال ذخیره...";

      fetch(url)
        .then(res => res.json())
        .then(res => {
          resetForm();
          loadContacts();
        })
        .catch(err => {
          alert("خطا در ذخیره‌سازی اطلاعات.");
          document.getElementById('submitBtn').innerText = "ذخیره مخاطب";
        });
    }

    function prepareEdit(row, name, phone) {
      document.getElementById('editRowIndex').value = row;
      document.getElementById('nameInput').value = name;
      document.getElementById('phoneInput').value = phone;
      document.getElementById('formTitle').innerText = "✏️ ویرایش مشخصات مخاطب";
      document.getElementById('submitBtn').innerText = "بروزرسانی مخاطب";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteContact(row) {
      if (!confirm("آیا از حذف این مخاطب مطمئن هستید؟")) return;

      const url = `${SCRIPT_URL}?action=delete&row=${row}`;

      fetch(url)
        .then(res => res.json())
        .then(res => {
          loadContacts();
        })
        .catch(err => {
          alert("خطا در حذف مخاطب.");
        });
    }

    function resetForm() {
      document.getElementById('editRowIndex').value = "";
      document.getElementById('nameInput').value = "";
      document.getElementById('phoneInput').value = "";
      document.getElementById('formTitle').innerText = "➕ افزودن مخاطب جدید";
      document.getElementById('submitBtn').innerText = "ذخیره مخاطب";
    }
  </script>

</body>
</html>
