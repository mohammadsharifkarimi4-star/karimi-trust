<button type="button" class="btn btn-info" onclick="playInteractionEffect(); toggleMaintenanceBox()">
  ⏳ در حال بروزرسانی
</button>

<div id="maintenanceBox" style="display:none; margin-top:12px; padding:14px; border-radius:16px; background:#eff6ff; border:1px solid #93c5fd; color:#1e3a8a; font-weight:800; text-align:center;">
  🔄 برنامه در حال کار و بروزرسانی است؛ به‌زودی آماده می‌شود.
</div>

<script>
  function toggleMaintenanceBox() {
    const box = document.getElementById("maintenanceBox");
    if (!box) return;
    box.style.display = box.style.display === "none" ? "block" : "none";
  }
</script>
