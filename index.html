<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خدمات مرکزی کریمی</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl; }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 30px 24px;
      border-radius: 30px;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .logo-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .header-title {
      color: #1e1b4b;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #e2e8f0;
      padding: 18px 20px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
    }

    .menu-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.15);
    }

    .menu-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: rgba(241, 245, 249, 0.7);
    }

    .menu-card.disabled:hover {
      border-color: #e2e8f0;
      transform: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
    }

    .menu-info {
      text-align: right;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 4px;
    }

    .menu-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .menu-badge {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 10px;
    }

    .menu-badge.soon {
      background: #f1f5f9;
      color: #64748b;
    }

    .footer-note {
      margin-top: 30px;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-icon">🛡️</div>
    <div class="header-title">خدمات مرکزی کریمی</div>
    <div class="header-subtitle">لطفاً بخش مورد نظر خود را انتخاب کنید</div>

    <div class="menu-grid">
      <!-- گزینه صرافی و امانت‌داری (فعال و متصل به شیت) -->
      <a href="exchange.html" class="menu-card">
        <div class="menu-info">
          <div class="menu-title">صرافی و امانت‌داری</div>
          <div class="menu-desc">استعلام موجودی و ریز تراکنش‌های مالی</div>
        </div>
        <div class="menu-badge">ورود</div>
      </a>

      <!-- نمونه خدمات آینده (غیرفعال و رزرو شده برای بعد) -->
      <div class="menu-card disabled">
        <div class="menu-info">
          <div class="menu-title">محاسبه‌گر نرخ ارز</div>
          <div class="menu-desc">محاسبه آنلاین تبدیل ارزها</div>
        </div>
        <div class="menu-badge soon">به زودی</div>
      </div>

      <div class="menu-card disabled">
        <div class="menu-info">
          <div class="menu-title">خدمات کاربردی دیگر</div>
          <div class="menu-desc">ابزارهای کمکی و خدماتی</div>
        </div>
        <div class="menu-badge soon">به زودی</div>
      </div>
    </div>

    <div class="footer-note">تمامی حقوق محفوظ است © کریمی مرکزی</div>
  </div>
</body>
</html>
