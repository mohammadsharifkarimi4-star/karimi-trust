<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صرافی و امانت‌داری کریمی</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fdf4ff 100%);
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.7);
      --text-main: #1e293b;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    h2 { text-align: center; color: #0f172a; margin-bottom: 20px; font-size: 20px; font-weight: bold; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: var(--text-muted); }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      text-align: center;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s;
    }
    input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      margin-top: 5px;
    }
    button:hover { background: #1d4ed8; }
    .card {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .balance-box:last-child { border-bottom: none; }
    .tx-item {
      border-bottom: 1px solid #f1f5f9;
      padding: 10px 0;
      font-size: 13px;
    }
    .tx-item:last-child { border-bottom: none; }
    .hidden { display: none !important; }
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #22c55e;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .whatsapp-btn:hover { background-color: #16a34a; }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
    }
    .welcome-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .loading { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>صرافی و امانت‌داری کریمی</h2>
    
    <div id="loadingSheet" class="loading">در حال اتصال به سامانه صرافی...</div>

    <div id="phoneSection" class="hidden">
      <div class="form-group">
        <label>شماره تلفن خود را وارد کنید:</label>
        <input type="text" id="phoneInput" placeholder="مثال: 9647721878997+">
      </div>
      <button onclick="checkPhone()">ادامه</button>
      <div id="phoneError" class="hidden error-box"></div>
    </div>

    <div id="accountSection" class="hidden">
      <div id="greetingMsg" style="text-align:center; font-weight:bold; color:#16a34a; margin-bottom:15px; font-size:15px;"></div>
      <div class="form-group">
        <label>کد حساب (Account ID) اختصاصی:</label>
        <input type="password" id="accountIdInput" placeholder="کد حساب خود را وارد کنید">
      </div>
      <button onclick="verifyAccount()">ورود به حساب</button>
      <button onclick="backToPhone()" style="background:#64748b; margin-top:8px;">تغییر شماره تلفن</button>
      <div id="accountError" class="hidden error-box"></div>
    </div>

    <div id="dashboardSection" class="hidden">
      <div class="welcome-header">
        <h3 id="dashWelcome" style="font-size: 15px; color: #0f172a;"></h3>
        <button onclick="logout()" style="width: auto; padding: 6px 12px; font-size: 12px; background: #ef4444; margin:0;">خروج</button>
      </div>
      
      <div class="card">
        <h4 style="margin-bottom: 8px; color: #334155; font-size: 14px;">وضعیت حساب</h4>
        <div id="balancesContainer"></div>
      </div>

      <div class="card">
        <h4 style="margin-bottom: 8px; color: #334155; font-size: 14px;">جزئیات حساب</h4>
        <div id="transactionsContainer" style="max-height: 220px; overflow-y: auto;"></div>
      </div>

      <a href="https://wa.me/9647721878997" target="_blank" class="whatsapp-btn">
        💬 ارسال پیام به کریمی در واتساپ
      </a>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1CKX1MyL8DCqsLZzRWq6h-6CRSLbfCZNp6ouY6MaT0Cg/export?format=csv";
    
    let sheetRecords = [];
    let currentFoundUser = null;

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        sheetRecords = parseCSV(csvText);
        
        document.getElementById('loadingSheet').classList.add('hidden');
        document.getElementById('phoneSection').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loadingSheet').innerText = 'خطا در بارگذاری اطلاعات. لطفاً صفحه را رفرش کنید.';
      }
    });

    function parseCSV(text) {
      const lines = text.split('\n');
      const result = [];
      if (lines.length === 0) return result;
      
      const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
      
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const currentline = lines[i].split(',');
        let obj = {};
        for (let j = 0; j < headers.length; j++) {
          obj[headers[j]] = currentline[j] ? currentline[j].trim().replace(/^["']|["']$/g, '') : '';
        }
        result.push(obj);
      }
      return result;
    }

    function cleanPhone(p) {
      if (!p) return '';
      return String(p).replace(/[\s\+\-\(\)]/g, '');
    }

    function checkPhone() {
      const rawInput = document.getElementById('phoneInput').value.trim();
      const errBox = document.getElementById('phoneError');
      errBox.classList.add('hidden');

      if (!rawInput) {
        errBox.innerText = 'لطفاً شماره تلفن را وارد کنید.';
        errBox.classList.remove('hidden');
        return;
      }

      const inputClean = cleanPhone(rawInput);
      const found = sheetRecords.find(u => cleanPhone(u.Phone) === inputClean);

      if (found) {
        currentFoundUser = found;
        document.getElementById('phoneSection').classList.add('hidden');
        document.getElementById('accountSection').classList.remove('hidden');
        document.getElementById('greetingMsg').innerText = `سلام ${found.Name}، خوش آمدید!`;
      } else {
        errBox.innerHTML = 'شماره شما در سیستم یافت نشد.<br><a href="https://wa.me/9647721878997?text=سلام%20کریمی%20عزیز،%20شماره%20من%20در%20سامانه%20نیست" target="_blank" style="color:#2563eb; font-weight:bold; text-decoration:underline; display:inline-block; margin-top:5px;">ارسال پیام واتساپ به کریمی برای ثبت حساب</a>';
        errBox.classList.remove('hidden');
      }
    }

    function verifyAccount() {
      const accIdInput = document.getElementById('accountIdInput').value.trim();
      const accErr = document.getElementById('accountError');
      accErr.classList.add('hidden');

      if (currentFoundUser && String(currentFoundUser.AccountID).trim() === accIdInput) {
        document.getElementById('accountSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('dashWelcome').innerText = `حساب کاربری: ${currentFoundUser.Name}`;

        document.getElementById('balancesContainer').innerHTML = `
          <div class="balance-box"><span>کد حساب: <b>${currentFoundUser.AccountID}</b></span><span style="color:#16a34a; font-weight:bold;">فعال</span></div>
        `;

        document.getElementById('transactionsContainer').innerHTML = `
          <div class="tx-item"><div><strong>وضعیت دسترسی</strong> - <span style="color:#16a34a; font-weight:bold;">تایید موفقیت‌آمیز</span></div><div style="color:#64748b; margin-top:2px;">اطلاعات از سامانه مرکزی صرافی کریمی خوانده شد.</div></div>
        `;
      } else {
        accErr.innerText = 'کد حساب (Account ID) وارد شده اشتباه است.';
        accErr.classList.remove('hidden');
      }
    }

    function backToPhone() {
      document.getElementById('accountSection').classList.add('hidden');
      document.getElementById('phoneSection').classList.remove('hidden');
      document.getElementById('accountIdInput').value = '';
    }

    function logout() {
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('phoneSection').classList.remove('hidden');
      document.getElementById('phoneInput').value = '';
      document.getElementById('accountIdInput').value = '';
      currentFoundUser = null;
    }
  </script>
</body>
</html>
