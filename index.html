<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب‌کتاب من</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');

    :root {
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --glass-card: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.4);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl; }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 10px;
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-section { text-align: center; margin-bottom: 25px; }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 75px; height: 75px;
      background: var(--primary-gradient);
      border-radius: 24px;
      font-size: 36px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      margin-bottom: 15px;
    }

    .header-title { color: #ffffff; font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .header-subtitle { color: #94a3b8; font-size: 14px; }

    .menu-grid { display: flex; flex-direction: column; gap: 16px; }

    .menu-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 20px;
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.35s ease;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .menu-card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .menu-info { text-align: right; }
    .menu-title { font-size: 17px; font-weight: 800; color: #1e1b4b; margin-bottom: 4px; }
    .menu-desc { font-size: 12px; color: var(--text-muted); }

    .menu-badge {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 12px;
    }

    .footer-note { text-align: center; margin-top: 30px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-section">
      <div class="logo-badge">💎</div>
      <div class="header-title">حساب‌کتاب من</div>
      <div class="header-subtitle">مدیریت هوشمند حساب‌ها و خدمات مالی</div>
    </div>

    <div class="menu-grid">
      <!-- گزینه اول: صرافی و امانت‌داری (متصل به گوگل شیت) -->
      <a href="exchange.html" class="menu-card">
        <div class="menu-info">
          <div class="menu-title">صرافی و امانت‌داری</div>
          <div class="menu-desc">استعلام موجودی و ریز تراکنش‌های مالی</div>
        </div>
        <div class="menu-badge">ورود</div>
      </a>

      <!-- گزینه دوم: حساب‌کتاب‌های شخصی (طلب، بدهی، خرج، درآمد روی حافظه محلی) -->
      <a href="finance.html" class="menu-card">
        <div class="menu-info">
          <div class="menu-title">حساب‌کتاب‌های شخصی</div>
          <div class="menu-desc">مدیریت طلب‌ها، بدهی‌ها، خرج‌ها و درآمدها</div>
        </div>
        <div class="menu-badge" style="background: #d1fae5; color: #065f46;">جدید</div>
      </a>

      <!-- گزینه سوم: رزرو برای آینده -->
      <div class="menu-card" style="opacity: 0.6; cursor: not-allowed;">
        <div class="menu-info">
          <div class="menu-title">ابزارهای کاربردی دیگر</div>
          <div class="menu-desc">امکانات کمکی آینده</div>
        </div>
        <div class="menu-badge" style="background: #f1f5f9; color: #64748b;">به زودی</div>
      </div>
    </div>

    <div class="footer-note">طراحی اختصاصی برای مدیریت امن امور مالی</div>
  </div>
</body>
</html>
