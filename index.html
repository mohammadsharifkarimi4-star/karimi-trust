
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>اطلاعیه مهم - امانت‌داری و حسابداری کریمی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #040711 85%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .notice-card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
      border: 2px solid #818cf8;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      color: #38bdf8;
      line-height: 1.4;
    }

    .status-pill {
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid #ef4444;
      color: #fca5a5;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
    }

    .message {
      font-size: 15.5px;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1.8;
    }

    .contact-box {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      border: 1.5px solid #34d399;
    }
  </style>
</head>
<body>

  <div class="notice-card">
    <div class="icon-badge">📱</div>
    <div class="status-pill">⚠️ این لینک دیگر فعال نیست</div>
    <h1 class="title">حسابداری کریمی توسعه داده شد و به اپلیکیشن تبدیل گردید</h1>
    <p class="message">
      سامانه قبلی متوقف شده است. برای دریافت نسخه جدید اپلیکیشن، لطفاً مستقیماً به کریمی پیام دهید.
    </p>
    <div class="contact-box">
      📩 برای دریافت اپلیکیشن به کریمی پیام دهید
    </div>
  </div>

</body>
</html>
