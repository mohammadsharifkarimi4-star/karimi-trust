<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب‌کتاب من</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');

    :root {
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.4);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl; }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
      50% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.4); }
      100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 10px;
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 75px;
      height: 75px;
      background: var(--primary-gradient);
      border-radius: 24px;
      font-size: 36px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      margin-bottom: 15px;
      animation: pulseGlow 4s infinite ease-in-out;
    }

    .header-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      color: #94a3b8;
      font-size: 14px;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 20px;
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; width: 5px; height: 100%;
      background: var(--primary-gradient);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .menu-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .menu-card:hover::before {
      opacity: 1;
    }

    .menu-card:active {
      transform: scale(0.97);
    }

    .menu-card.disabled {
      opacity: 0.65;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.5);
    }

    .menu-card.disabled:hover {
      transform: none;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      border-color: var(--glass-border);
    }

    .menu-info {
      text-align: right;
    }

    .menu-title {
      font-size: 17px;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 4px;
    }

    .menu-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .menu-badge {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .menu-card:hover .menu-badge {
      background: var(--primary);
      color: #ffffff;
    }

    .menu-badge.soon {
      background: #f1f5f9;
      color: #64748b;
    }

    .footer-note {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-section">
      <div class="logo-badge">💎</div>
      <div class="header-title">حساب‌کتاب من</div>
      <div class="header-subtitle">مدیریت هوشمند حساب‌ها و خدمات مالی</div>
    </div>

    <div class="menu-grid">
      <!-- بخش صرافی و حساب‌ها (فعال) -->
      <a href="exchange.html" class="menu-card">
        <div class="menu-info">
          <div class="menu-title">صرافی و امانت‌داری</div>
          <div class="menu-desc">استعلام موجودی و ریز تراکنش‌های مالی</div>
        </div>
        <div class="menu-badge">ورود</div>
      </a>

      <!-- خدمات آینده (غیرفعال و شیک) -->
      <div class="menu-card disabled">
        <div class="menu-info">
          <div class="menu-title">محاسبه‌گر نرخ ارز</div>
          <div class="menu-desc">محاسبه آنلاین و سریع تبدیل ارزها</div>
        </div>
        <div class="menu-badge soon">به زودی</div>
      </div>

      <div class="menu-card disabled">
        <div class="menu-info">
          <div class="menu-title">ابزارهای کاربردی</div>
          <div class="menu-desc">امکانات و خدمات کمکی دیگر</div>
        </div>
        <div class="menu-badge soon">به زودی</div>
      </div>
    </div>

    <div class="footer-note">طراحی اختصاصی برای مدیریت امن امور مالی</div>
  </div>
</body>
</html>
