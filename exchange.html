<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>صرافی و امانت‌داری کریمی مرکزی</title>
  <!-- فونت فرهنگ (Farhang) -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Farhang';
      src: url('https://cdn.jsdelivr.net/gh/font-store/farhang@main/Farhang-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Farhang';
      src: url('https://cdn.jsdelivr.net/gh/font-store/farhang@main/Farhang-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
  </style>
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --success: #059669;
      --danger: #dc2626;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Farhang', 'Vazirmatn', sans-serif; direction: rtl; }

    body {
      background: #0f172a;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      overflow: hidden;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      max-height: 920px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border-radius: 24px;
    }

    @media (max-width: 480px) {
      .app-viewport { max-height: 100vh; border-radius: 0; }
    }

    .app-header {
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-title { font-size: 15px; font-weight: 700; color: #1e1b4b; }
    
    .app-body {
      flex: 1;
      padding: 10px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .form-group { margin-bottom: 12px; }
    
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      text-align: center;
      outline: none;
      background: #ffffff;
      direction: ltr;
      color: #0f172a;
      font-weight: 700;
    }

    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      margin-top: 6px;
      transition: transform 0.1s ease;
    }

    button:active { transform: scale(0.98); }

    .user-profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #ffffff;
      border-radius: 14px;
      margin-bottom: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.03);
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .currency-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .currency-tab {
      flex: 1;
      min-width: 60px;
      padding: 7px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      box-shadow: none;
      margin-top: 0;
      transition: all 0.2s ease;
    }

    .currency-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .currency-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      border-right: 5px solid var(--primary);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .big-notification-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.3); }
      70% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .flying-tx-element {
      position: fixed;
      z-index: 9999;
      background: #10b981;
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fullscreen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fullscreen-modal.open { transform: translateY(0); }

    .modal-header {
      padding: 12px 14px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      flex-shrink: 0;
    }

    .modal-scroll-body { flex: 1; padding: 14px; overflow-y: auto; }

    .tx-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      cursor: pointer;
    }

    .action-btn {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: white;
    }

    .whatsapp-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      font-weight: 700;
    }

    .eng-num { font-family: Tahoma, sans-serif; direction: ltr; display: inline-block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header class="app-header">
      <a href="index.html" style="color: #64748b; text-decoration: none; font-size: 12px; font-weight: 700;">← منو</a>
      <div class="header-title">🛡️ صرافی و امانت‌داری کریمی</div>
      <div style="width: 25px;"></div>
    </header>

    <main class="app-body">
      <div id="loadingSheet" style="text-align: center; padding: 60px 0; font-weight: 700; color: #475569;">در حال اتصال به پایگاه داده...</div>

      <!-- مرحله ۱: ورود شماره تلفن -->
      <div id="phoneSection" class="hidden" style="margin: auto 0;">
        <div style="text-align: center; margin-bottom: 16px; font-weight: 700; font-size: 16px; color: #1e1b4b;">ورود به حساب کاربری</div>
        <div class="form-group">
          <input type="text" id="phoneInput" placeholder="شماره تماس">
        </div>
        <button id="btnCheckPhone" onclick="checkPhone()">مرحله بعد</button>
        <div id="phoneError" class="hidden error-box">شماره شما در سیستم یافت نشد.</div>
      </div>

      <!-- مرحله ۲: احراز هویت با گوگل -->
      <div id="googleAuthSection" class="hidden" style="margin: auto 0; text-align: center;">
        <div style="font-size: 36px; margin-bottom: 6px;">🔐</div>
        <div style="font-weight: 700; font-size: 16px; color: #1e1b4b; margin-bottom: 16px;">احراز هویت با گوگل</div>
        
        <div style="display: flex; justify-content: center; margin-bottom: 10px;">
          <div id="g_id_onload"
               data-client_id="295722018163-ckrb0g42a6c9o5udbfird31r8jvb3avn.apps.googleusercontent.com"
               data-callback="handleGoogleLogin"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
        </div>
        <button onclick="backToPhone()" style="background: #64748b; margin-top: 6px;">بازگشت</button>
      </div>

      <!-- مرحله ۳: کد اختصاصی حساب (Account ID) -->
      <div id="accountSection" class="hidden" style="margin: auto 0;">
        <div id="greetingMsg" style="text-align:center; font-weight:700; color:var(--success); margin-bottom:14px; font-size:15px;"></div>
        <div class="form-group">
          <input type="password" id="accountIdInput" placeholder="Account ID">
        </div>
        <button id="btnVerifyAcc" onclick="verifyAccount()">ورود به سیستم</button>
        <button onclick="backToGoogle()" style="background: #64748b; margin-top: 6px;">بازگشت</button>
        <div id="accountError" class="hidden error-box">کد حساب اشتباه است.</div>
      </div>

      <!-- داشبورد اصلی -->
      <div id="dashboardSection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div>
          <div class="user-profile-header">
            <div>
              <div id="dashName" style="font-weight: 700; font-size: 14.5px; color: #1e1b4b;">---</div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;"><span id="dashPhone" class="eng-num">---</span></div>
            </div>
            <div>
              <button onclick="logout()" style="width: auto; padding: 4px 10px; font-size: 11px; background: var(--danger); margin-top: 0; box-shadow: none;">خروج</button>
            </div>
          </div>

          <!-- اعلان تراکنش جدید (فقط در صورت وجود تراکنش جدید بعد از آخرین ورود) -->
          <div id="newTxNotificationWrapper" class="hidden">
            <button class="big-notification-btn" onclick="confirmNewTransaction()">
              ✨ تراکنش جدیدی در حساب شما ثبت شده است! (تأیید)
            </button>
          </div>

          <div style="font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 4px;">📊 آمار موجودی حساب</div>
          <div class="currency-tabs" id="currencyTabs"></div>
          <div id="activeCurrencyCard"></div>
        </div>

        <!-- دکمه ثابت انتهای صفحه برای باز کردن لیست معاملات -->
        <div style="margin-top: auto; padding-top: 6px;">
          <button onclick="openTransactionsModal()" style="padding: 13px; font-size: 14.5px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);">
            📋 مشاهده معاملات و تراکنش‌ها (<span id="txCountBadge" class="eng-num">0</span>)
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- مودال لیست معاملات و تراکنش‌ها -->
  <div id="transactionsModal" class="fullscreen-modal">
    <div class="modal-header">
      <h3 style="font-size: 14.5px; color: #1e293b; font-weight: 700;">📋 لیست کامل معاملات</h3>
      <button onclick="closeTransactionsModal()" style="width: auto; padding: 4px 10px; font-size: 11.5px; background: #64748b; margin-top:0; box-shadow:none;">بستن ✕</button>
    </div>
    <div class="modal-scroll-body" id="transactionsContainer"></div>
  </div>

  <!-- مودال جزئیات و اکشن‌های تراکنش -->
  <div id="txDetailModal" class="fullscreen-modal">
    <div class="modal-header">
      <h3 style="font-size: 14.5px; color: #1e293b; font-weight: 700;">📄 جزئیات تراکنش</h3>
      <button onclick="closeDetailModal()" style="width: auto; padding: 4px 10px; font-size: 11.5px; background: #64748b; margin-top:0; box-shadow:none;">بازگشت</button>
    </div>
    <div class="modal-scroll-body">
      <div id="receiptToCapture" style="background: #ffffff; border: 1.5px solid #e2e8f0; padding: 14px; border-radius: 14px; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; border-bottom: 1.5px dashed #cbd5e1; padding-bottom: 6px; margin-bottom: 8px;">
          <span style="font-size: 11.5px; font-weight: 700; color: #0284c7;">🛡️ رسید رسمی صرافی کریمی</span>
          <span style="font-size: 10px; color: #64748b;">امانت‌داری مرکزی</span>
        </div>
        <div id="modalBody" style="font-size: 12.5px; color: #334155; line-height: 1.8;" class="eng-num"></div>
      </div>

      <button class="action-btn" onclick="shareRecordImage()" style="background: #3b82f6;">📸 ارسال و دانلود عکس گزارش</button>
      <button class="action-btn" onclick="requestEdit()" style="background: #f59e0b;">✏️ درخواست ویرایش این تراکنش</button>
      
      <div id="hawalaReceiptWrapper" class="hidden">
        <button class="action-btn" onclick="shareHawalaReceipt()" style="background: #8b5cf6;">📜 ارسال رسید حواله</button>
      </div>

      <a id="modalWhatsApp" href="#" target="_blank" class="action-btn whatsapp-btn">💬 ارتباط با پشتیبانی در واتساپ</a>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFzeaXRRzvaOs_ea0OFBy15SGrSEOkdKox8RlV9Q7upMCWJmp1DylrPus1VmOvbkMa/exec?action=getData";

    let accountsList = [];
    let transactionsList = [];
    let currentFoundUser = null;
    let verifiedEmail = '';
    let customerTransactions = [];
    let customerBalances = {};
    let currencyList = [];
    let activeCurrencyIndex = 0;
    let selectedTxItem = null;

    // صدای شاتر دوربین سامسونگ قدیمی و افکت‌های صوتی
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'shutter') {
          // شبیه‌سازی صدای شاتر دوربین قدیمی سامسونگ (کلیک مکانیکی همراه با پالس کوتاه)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.08);
          return;
        }

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'click') {
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          gain.gain.setValueAtTime(0.03, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.06, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'fly') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(250, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();

        if (data.accounts && data.accounts.length > 0) {
          let accRows = data.accounts;
          let accHeaders = accRows[0];
          accountsList = accRows.slice(1).map(row => {
            let obj = {};
            accHeaders.forEach((h, i) => obj[h.toString().trim()] = row[i]);
            return obj;
          });
        }

        if (data.transactions && data.transactions.length > 0) {
          let txRows = data.transactions;
          let txHeaders = txRows[0];
          transactionsList = txRows.slice(1).map(row => {
            let obj = {};
            txHeaders.forEach((h, i) => obj[h.toString().trim()] = row[i]);
            return obj;
          });
        }

        document.getElementById('loadingSheet').classList.add('hidden');

        const savedPhone = localStorage.getItem('karimi_phone');
        const savedAccId = localStorage.getItem('karimi_accId');
        const savedEmail = localStorage.getItem('karimi_email');

        if (savedPhone && savedAccId && savedEmail) {
          autoLogin(savedPhone, savedAccId, savedEmail);
        } else {
          document.getElementById('phoneSection').classList.remove('hidden');
        }

      } catch (err) {
        document.getElementById('loadingSheet').innerHTML = '<div class="error-box">خطا در بارگذاری اطلاعات.</div>';
      }
    });

    function cleanDigits(str) {
      if (!str) return '';
      return String(str).replace(/\D/g, '');
    }

    function checkPhone() {
      playSound('click');
      const rawInput = document.getElementById('phoneInput').value.trim();
      const errBox = document.getElementById('phoneError');
      errBox.classList.add('hidden');

      if (!rawInput) return;
      const userDigits = cleanDigits(rawInput);

      const found = accountsList.find(u => {
        let phoneVal = u.Phone || u.phone || u['تلفن'] || '';
        const sheetPhone = cleanDigits(phoneVal);
        if (!sheetPhone) return false;
        return sheetPhone === userDigits || sheetPhone.endsWith(userDigits) || userDigits.endsWith(sheetPhone) || (userDigits.length >= 5 && sheetPhone.slice(-5) === userDigits.slice(-5));
      });

      if (found) {
        currentFoundUser = found;
        document.getElementById('phoneSection').classList.add('hidden');
        document.getElementById('googleAuthSection').classList.remove('hidden');
      } else {
        errBox.innerText = 'شماره شما در سیستم یافت نشد.';
        errBox.classList.remove('hidden');
      }
    }

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) { return null; }
    }

    function handleGoogleLogin(response) {
      playSound('success');
      const payload = parseJwt(response.credential);
      if (payload) {
        verifiedEmail = payload.email.toLowerCase();
        document.getElementById('googleAuthSection').classList.add('hidden');
        document.getElementById('accountSection').classList.remove('hidden');
        let nameVal = currentFoundUser.Name || currentFoundUser.name || 'مشتری عزیز';
        document.getElementById('greetingMsg').innerText = `سلام ${nameVal}، خوش آمدید!`;
      }
    }

    function verifyAccount() {
      playSound('click');
      const accIdInput = document.getElementById('accountIdInput').value.trim().toLowerCase();
      const accErr = document.getElementById('accountError');
      accErr.classList.add('hidden');

      if (!accIdInput) return;

      let sheetAccId = String(currentFoundUser.AccountID || currentFoundUser.accountid || currentFoundUser.ID || '').trim().toLowerCase();

      if (sheetAccId === accIdInput) {
        localStorage.setItem('karimi_phone', currentFoundUser.Phone || currentFoundUser.phone || '');
        localStorage.setItem('karimi_accId', sheetAccId);
        localStorage.setItem('karimi_email', verifiedEmail);
        
        // ثبت زمان آخرین ورود کاربر جهت تشخیص تراکنش‌های جدید بعد از این لحظه
        if (!localStorage.getItem('karimi_last_login')) {
          localStorage.setItem('karimi_last_login', new Date().getTime());
        }

        processDashboard(sheetAccId);
      } else {
        accErr.innerText = 'کد حساب اشتباه است.';
        accErr.classList.remove('hidden');
      }
    }

    function autoLogin(phone, accId, email) {
      const userDigits = cleanDigits(phone);
      const found = accountsList.find(u => {
        let phoneVal = u.Phone || u.phone || u['تلفن'] || '';
        const sheetPhone = cleanDigits(phoneVal);
        return sheetPhone && (sheetPhone === userDigits || sheetPhone.endsWith(userDigits) || userDigits.endsWith(sheetPhone) || sheetPhone.slice(-5) === userDigits.slice(-5));
      });

      if (found) {
        let sheetAccId = String(found.AccountID || found.accountid || found.ID || '').trim().toLowerCase();
        if (sheetAccId === accId.toLowerCase()) {
          currentFoundUser = found;
          verifiedEmail = email;
          processDashboard(sheetAccId);
          return;
        }
      }
      localStorage.clear();
      document.getElementById('phoneSection').classList.remove('hidden');
    }

    function backToPhone() {
      playSound('click');
      document.getElementById('googleAuthSection').classList.add('hidden');
      document.getElementById('phoneSection').classList.remove('hidden');
    }

    function backToGoogle() {
      playSound('click');
      document.getElementById('accountSection').classList.add('hidden');
      document.getElementById('googleAuthSection').classList.remove('hidden');
    }

    function processDashboard(sheetAccId) {
      document.getElementById('phoneSection').classList.add('hidden');
      document.getElementById('googleAuthSection').classList.add('hidden');
      document.getElementById('accountSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      
      let nameVal = currentFoundUser.Name || currentFoundUser.name || '---';
      let phoneVal = currentFoundUser.Phone || currentFoundUser.phone || '---';

      document.getElementById('dashName').innerText = nameVal;
      document.getElementById('dashPhone').innerText = phoneVal;

      customerTransactions = transactionsList.filter(tx => {
        let rowAccId = String(tx.AccountID || tx.accountid || tx.ID || '').trim().toLowerCase();
        return rowAccId === sheetAccId;
      }).reverse();

      customerBalances = {};
      customerTransactions.forEach(tx => {
        let curr = String(tx.Currency || tx.currency || 'AFN').toUpperCase();
        let amount = parseFloat(tx.Amount || tx.amount) || 0;
        let dir = String(tx.Direction || tx.direction || '').trim();

        if (!customerBalances[curr]) {
          customerBalances[curr] = { credit: 0, debit: 0, net: 0 };
        }
        if (dir.includes('بستانکار') || dir.includes('دریافت')) {
          customerBalances[curr].credit += amount;
        } else if (dir.includes('بدهکار') || dir.includes('پرداخت')) {
          customerBalances[curr].debit += amount;
        }
      });

      for (let c in customerBalances) {
        customerBalances[c].net = customerBalances[c].credit - customerBalances[c].debit;
      }

      currencyList = Object.keys(customerBalances);
      if (currencyList.length === 0) {
        currencyList = ['AFN'];
        customerBalances['AFN'] = { credit: 0, debit: 0, net: 0 };
      }

      activeCurrencyIndex = 0;
      renderCurrencyTabs();
      renderTransactionsList();
      checkNewTransactionsNotification();
    }

    function renderCurrencyTabs() {
      let tabsHtml = '';
      currencyList.forEach((curr, idx) => {
        let activeClass = idx === activeCurrencyIndex ? 'active' : '';
        tabsHtml += `<button class="currency-tab ${activeClass}" onclick="switchCurrency(${idx})">${curr}</button>`;
      });
      document.getElementById('currencyTabs').innerHTML = tabsHtml;
      renderActiveCurrencyCard();
    }

    function switchCurrency(idx) {
      playSound('click');
      activeCurrencyIndex = idx;
      renderCurrencyTabs();
    }

    function renderActiveCurrencyCard() {
      let currName = currencyList[activeCurrencyIndex];
      let b = customerBalances[currName] || { credit: 0, debit: 0, net: 0 };
      let netColor = b.net >= 0 ? 'var(--success)' : 'var(--danger)';
      
      let cardHtml = `
        <div class="currency-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span style="font-weight: 700; font-size: 13px; color: #1e293b;">ارز: ${currName}</span>
            <span style="font-size: 16px; font-weight: 700; color: ${netColor};" class="eng-num">${b.net.toLocaleString()}</span>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 11px; border-top: 1px solid #f1f5f9; padding-top: 6px; color: var(--text-muted);">
            <span>بستانکار (+): <b style="color: var(--success);" class="eng-num">${b.credit.toLocaleString()}</b></span>
            <span>بدهکار (-): <b style="color: var(--danger);" class="eng-num">${b.debit.toLocaleString()}</b></span>
          </div>
        </div>`;
      document.getElementById('activeCurrencyCard').innerHTML = cardHtml;
    }

    // شرط هوشمند: بررسی وجود تراکنش جدید فقط بعد از آخرین ورود کاربر
    function checkNewTransactionsNotification() {
      const lastLogin = Number(localStorage.getItem('karimi_last_login')) || 0;
      // بررسی اینکه آیا تراکنشی وجود دارد که تاریخ ثبت آن جدیدتر از آخرین ورود باشد
      // (اگر فیلد تاریخ در شیت موجود باشد مقایسه می‌کنیم، یا به عنوان مکانیزم هوشمند بررسی می‌کنیم)
      let hasNew = customerTransactions.some(tx => {
        let txTime = new Date(tx.Date || tx.date || Date.now()).getTime();
        return txTime > lastLogin;
      });

      // برای اینکه تست هم راحت باشد اگر تعداد تراکنش‌ها زیاد بود و اولین بار بود، بررسی می‌کنیم
      if (hasNew || (customerTransactions.length > 0 && lastLogin === 0)) {
        document.getElementById('newTxNotificationWrapper').classList.remove('hidden');
      } else {
        document.getElementById('newTxNotificationWrapper').classList.add('hidden');
      }
    }

    function confirmNewTransaction() {
      playSound('fly');
      const btn = document.getElementById('newTxNotificationWrapper');
      
      const flyer = document.createElement('div');
      flyer.className = 'flying-tx-element';
      flyer.innerText = '✨ تراکنش جدید تأیید و منتقل شد';
      document.body.appendChild(flyer);

      const rect = btn.getBoundingClientRect();
      flyer.style.top = rect.top + 'px';
      flyer.style.left = rect.left + 'px';

      setTimeout(() => {
        flyer.style.transform = 'translate(120px, 320px) scale(0.2) rotate(360deg)';
        flyer.style.opacity = '0';
      }, 50);

      setTimeout(() => {
        flyer.remove();
        btn.classList.add('hidden');
        // آپدیت زمان آخرین ورود تا دیگر این اعلان نشان داده نشود تا زمان تراکنش بعدی
        localStorage.setItem('karimi_last_login', new Date().getTime());
      }, 850);
    }

    function openTransactionsModal() {
      playSound('click');
      document.getElementById('transactionsModal').classList.add('open');
    }

    function closeTransactionsModal() {
      playSound('click');
      document.getElementById('transactionsModal').classList.remove('open');
    }

    function renderTransactionsList() {
      let txHtml = '';
      if (customerTransactions.length === 0) {
        txHtml = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12.5px;">هیچ معامله‌ای یافت نشد.</div>';
      } else {
        customerTransactions.forEach((tx, idx) => {
          let dir = String(tx.Direction || tx.direction || '');
          let amtColor = (dir.includes('بستانکار') || dir.includes('دریافت')) ? 'var(--success)' : 'var(--danger)';
          let amountVal = parseFloat(tx.Amount || tx.amount) || 0;
          
          txHtml += `
            <div class="tx-card" onclick="openDetailModal(${idx})">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span style="font-weight:700; font-size:13px; color:#1e293b;">${tx.OperationType || tx.operationtype || 'عملیات مالی'}</span>
                <span style="font-size:11px; background:#f1f5f9; padding:2px 8px; border-radius:6px; color:var(--text-muted); font-weight:700;" class="eng-num">${tx.Date || tx.date || '---'}</span>
              </div>
              <div style="font-size:11px; color:#334155; margin-bottom:8px; line-height:1.5;">
                ${tx.Description || tx.description || 'بدون شرح'}
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f1f5f9; padding-top:6px;">
                <span style="font-weight:700; font-size:12.5px; color:${amtColor};" class="eng-num">${tx.Currency || tx.currency || 'AFN'} ${amountVal.toLocaleString()} (${dir})</span>
                <span style="color:#4f46e5; font-size:11px; font-weight:700;">جزئیات ➔</span>
              </div>
            </div>`;
        });
      }
      document.getElementById('transactionsContainer').innerHTML = txHtml;
      document.getElementById('txCountBadge').innerText = customerTransactions.length;
    }

    function openDetailModal(idx) {
      playSound('click');
      selectedTxItem = customerTransactions[idx];
      let tx = selectedTxItem;
      let dir = String(tx.Direction || tx.direction || '');
      let amtColor = (dir.includes('بستانکار') || dir.includes('دریافت')) ? 'var(--success)' : 'var(--danger)';

      let bodyHtml = `
        <p><b>شناسه:</b> <span class="eng-num">${tx.TransID || tx.transid || '---'}</span></p>
        <p><b>نوع عملیات:</b> ${tx.OperationType || tx.operationtype || '---'}</p>
        <p><b>تاریخ:</b> <span class="eng-num">${tx.Date || tx.date || '---'}</span></p>
        <p><b>شرح و جزئیات:</b> ${tx.Description || tx.description || '---'}</p>
        <p><b>مبلغ:</b> <span class="eng-num" style="font-weight:bold; color:${amtColor};">${Number(tx.Amount || 0).toLocaleString()} ${tx.Currency || ''}</span></p>
        <p><b>وضعیت:</b> <span style="color:var(--success); font-weight:bold;">${tx.Status || tx.status || 'تأیید شده'}</span></p>
      `;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modalWhatsApp').href = `https://wa.me/9647721878997?text=سلام%20درخواست%20پشتیبانی%20برای%20تراکنش%20شماره%20${tx.TransID || (idx+1)}%20را دارم`;

      let opType = String(tx.OperationType || tx.operationtype || '');
      if (opType.includes('حواله')) {
        document.getElementById('hawalaReceiptWrapper').classList.remove('hidden');
      } else {
        document.getElementById('hawalaReceiptWrapper').classList.add('hidden');
      }

      document.getElementById('txDetailModal').classList.add('open');
    }

    function closeDetailModal() {
      playSound('click');
      document.getElementById('txDetailModal').classList.remove('open');
    }

    function requestEdit() {
      playSound('click');
      window.open(`https://wa.me/9647721878997?text=سلام%20درخواست%20ویرایش%20تراکنش%20با%20شناسه%20${selectedTxItem.TransID || ''}%20را دارم`, '_blank');
    }

    function shareRecordImage() {
      playSound('shutter'); // صدای شاتر دوربین سامسونگ قدیمی
      const el = document.getElementById('receiptToCapture');
      html2canvas(el, { scale: 3, backgroundColor: '#ffffff' }).then(canvas => {
        canvas.toBlob(blob => {
          const file = new File([blob], 'karimi-receipt.png', { type: 'image/png' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: 'رسید صرافی کریمی' }).catch(() => {});
          } else {
            const link = document.createElement('a');
            link.download = 'karimi-receipt.png';
            link.href = canvas.toDataURL();
            link.click();
          }
        });
      });
    }

    function shareHawalaReceipt() {
      playSound('shutter'); // صدای شاتر دوربین سامسونگ قدیمی
      const descText = selectedTxItem.Description || selectedTxItem.description || 'بدون توضیحات';
      const hawalaBox = document.createElement('div');
      hawalaBox.style.cssText = "background: #ffffff; border: 2px solid #8b5cf6; padding: 18px; border-radius: 16px; width: 350px; direction: rtl; font-family: 'Farhang', sans-serif;";
      hawalaBox.innerHTML = `
        <div style="font-weight: 800; font-size: 14px; color: #7c3aed; margin-bottom: 8px; border-bottom: 1.5px dashed #cbd5e1; padding-bottom: 6px;">📜 رسید رسمی حواله - صرافی کریمی</div>
        <div style="font-size: 12.5px; line-height: 1.8; color: #1e293b;">
          <b>مشخصات و توضیحات حواله:</b><br>
          <span class="eng-num">${descText}</span>
        </div>
        <div style="margin-top: 10px; font-size: 10px; color: #64748b; text-align: left;" class="eng-num">Date: ${selectedTxItem.Date || ''}</div>
      `;
      document.body.appendChild(hawalaBox);

      html2canvas(hawalaBox, { scale: 3, backgroundColor: '#ffffff' }).then(canvas => {
        hawalaBox.remove();
        canvas.toBlob(blob => {
          const file = new File([blob], 'hawala-receipt.png', { type: 'image/png' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: 'رسید حواله کریمی' }).catch(() => {});
          } else {
            const link = document.createElement('a');
            link.download = 'hawala-receipt.png';
            link.href = canvas.toDataURL();
            link.click();
          }
        });
      });
    }

    function logout() {
      playSound('click');
      if (confirm('آیا می‌خواهید از حساب خارج شوید؟')) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
