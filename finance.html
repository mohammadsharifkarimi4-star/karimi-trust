<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت مالی شخصی</title>
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- بخش ورود (Authentication) -->
    <div id="auth-section" class="bg-white p-6 rounded-2xl shadow-sm text-center my-10">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">حسابداری شخصی</h1>
        <p class="text-sm text-gray-500 mb-6">برای ذخیره و مدیریت اطلاعات مالی خود وارد شوید</p>
        
        <div id="g_id_onload"
             data-client_id="295722018163-ckrb0g42a6c9o5udbfird31r8jvb3avn.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin flex justify-center"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
    </div>

    <!-- داشبورد اصلی (پس از ورود) -->
    <div id="app-section" class="hidden space-y-4">
        
        <!-- پروفایل کاربر -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="user-avatar" class="w-10 h-10 rounded-full" src="" alt="User Avatar">
                <div>
                    <h2 id="user-name" class="font-bold text-gray-800 text-sm"></h2>
                    <p id="user-email" class="text-xs text-gray-400"></p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-red-500 bg-red-50 px-3 py-1.5 rounded-lg font-medium">خروج</button>
        </div>

        <!-- کارت موجودی -->
        <div class="bg-blue-600 text-white p-5 rounded-2xl shadow-md">
            <span class="text-xs text-blue-100 opacity-80">موجودی کل</span>
            <div id="total-balance" class="text-2xl font-black mt-1">۰ تومان</div>
        </div>

        <!-- ثبت تراکنش جدید -->
        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
            <h3 class="font-bold text-gray-700 text-sm">ثبت تراکنش جدید</h3>
            <div class="flex gap-2">
                <input id="tx-title" type="text" placeholder="عنوان (مثلاً: خرید نان)" class="w-full text-sm p-2.5 border rounded-xl outline-none focus:border-blue-500">
                <input id="tx-amount" type="number" placeholder="مبلغ" class="w-1/2 text-sm p-2.5 border rounded-xl outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2">
                <select id="tx-type" class="w-full text-sm p-2.5 border rounded-xl outline-none bg-white">
                    <option value="expense">هزینه (برداشت)</option>
                    <option value="income">درآمد (واریز)</option>
                </select>
                <button onclick="addTransaction()" class="w-1/2 bg-blue-600 text-white font-medium text-sm rounded-xl py-2.5 hover:bg-blue-700">ثبت</button>
            </div>
        </div>

        <!-- لیست تراکنش‌ها -->
        <div class="bg-white p-4 rounded-2xl shadow-sm">
            <h3 class="font-bold text-gray-700 text-sm mb-3">تراکنش‌های اخیر</h3>
            <div id="tx-list" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-xs text-gray-400 text-center py-4">تراکنشی ثبت نشده است</p>
            </div>
        </div>

    </div>

    <script>
        const JSONBIN_API_KEY = '$2a$10$vQ6/8A4K3/R.6R/.n.m5EOd7gK3uX6k6QJ7yP0R.j0Z.9k3S7bW2O'; // جایگزین با کلید JSONbin در صورت نیاز
        let currentUser = null;
        let transactions = [];

        // رمزگشایی توکن گوگل
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // ورود گوگل
        function handleCredentialResponse(response) {
            currentUser = parseJwt(response.credential);
            document.getElementById('user-name').innerText = currentUser.name;
            document.getElementById('user-email').innerText = currentUser.email;
            document.getElementById('user-avatar').src = currentUser.picture;
            
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');

            loadData();
        }

        function logout() {
            currentUser = null;
            transactions = [];
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
        }

        // بارگیری داده‌ها از Cloud (JSONbin)
        async function loadData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b`, {
                    headers: {
                        'X-Master-Key': JSONBIN_API_KEY,
                        'X-Bin-Name': currentUser.email
                    }
                });
                // بارگیری اولیه و ساخت لیست بر اساس ایمیل کاربر انجام می‌شود
                render();
            } catch (e) {
                console.log("خطا در دریافت داده‌ها", e);
            }
        }

        // افزودن تراکنش جدید
        function addTransaction() {
            const title = document.getElementById('tx-title').value.trim();
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const type = document.getElementById('tx-type').value;

            if (!title || isNaN(amount) || amount <= 0) return;

            transactions.unshift({ id: Date.now(), title, amount, type });
            document.getElementById('tx-title').value = '';
            document.getElementById('tx-amount').value = '';

            render();
        }

        // به‌روزرسانی رابط کاربری
        function render() {
            const listEl = document.getElementById('tx-list');
            let balance = 0;

            if (transactions.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">تراکنشی ثبت نشده است</p>';
            } else {
                listEl.innerHTML = transactions.map(t => {
                    if (t.type === 'income') balance += t.amount;
                    else balance -= t.amount;

                    return `
                        <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl text-sm">
                            <div>
                                <div class="font-medium text-gray-800">${t.title}</div>
                            </div>
                            <div class="font-bold ${t.type === 'income' ? 'text-green-600' : 'text-red-500'}">
                                ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('total-balance').innerText = balance.toLocaleString() + ' تومان';
        }
    </script>
</body>
</html>
