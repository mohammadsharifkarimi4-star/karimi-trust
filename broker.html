<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت صرافی و کارگزاران</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 90px; }
        .card-custom { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .btn-curr.active { background: #2563eb !important; color: #fff !important; }
    </style>
</head>
<body>

    <!-- صفحه لاگین ادمین -->
    <div id="loginOverlay" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4">
        <div class="card-custom bg-white w-full max-w-sm p-6 space-y-4 text-right">
            <h2 class="font-black text-sm text-slate-800 text-center">ورود به مدیریت صرافی</h2>
            <form onsubmit="doLogin(event)" class="space-y-3">
                <input type="email" id="lEmail" required placeholder="ایمیل ادمین" class="w-full bg-slate-50 border p-3 rounded-xl text-xs font-bold" dir="ltr">
                <input type="password" id="lPin" required placeholder="رمز پین" class="w-full bg-slate-50 border p-3 rounded-xl text-xs font-bold" dir="ltr">
                <div id="lErr" class="text-red-600 text-[11px] font-bold text-center hidden">اطلاعات اشتباه است</div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-black text-xs">ورود</button>
            </form>
        </div>
    </div>

    <!-- هدر -->
    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-30 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2">
            <a href="index.html" class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center"><i class="fa-solid fa-arrow-right"></i></a>
            <h1 class="font-black text-sm">مدیریت صرافی‌ها</h1>
        </div>
        <button onclick="openModal('brokerModal')" class="bg-white text-indigo-700 text-xs px-3 py-2 rounded-xl font-black shadow">+ صرافی جدید</button>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-4">
        <!-- انتخاب صرافی -->
        <div class="card-custom p-4 space-y-2">
            <label class="block text-xs font-black text-slate-700">انتخاب صرافی فعال:</label>
            <select id="brokerSelect" onchange="onBrokerChange()" class="w-full bg-slate-50 border p-3 font-bold text-xs rounded-xl outline-none">
                <option value="">در حال بارگذاری صرافی‌ها...</option>
            </select>
            <div class="flex justify-between text-xs text-slate-500 pt-2 border-t">
                <span>شناسه: <b id="mId" class="text-indigo-600">-</b></span>
                <span>تلفن: <b id="mPhone">-</b></span>
                <span>شهر: <b id="mCity">-</b></span>
            </div>
        </div>

        <!-- مانده‌ها -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div class="bg-blue-600 text-white p-3 rounded-xl text-center"><span class="text-[10px] block">USD</span><b id="bUSD" class="text-sm">0</b></div>
            <div class="bg-emerald-600 text-white p-3 rounded-xl text-center"><span class="text-[10px] block">AFN</span><b id="bAFN" class="text-sm">0</b></div>
            <div class="bg-purple-600 text-white p-3 rounded-xl text-center"><span class="text-[10px] block">IQD</span><b id="bIQD" class="text-sm">0</b></div>
            <div class="bg-amber-600 text-white p-3 rounded-xl text-center"><span class="text-[10px] block">تومان</span><b id="bTMN" class="text-sm">0</b></div>
        </div>

        <!-- فرم ثبت تراکنش -->
        <div class="card-custom p-4 space-y-3">
            <h2 class="text-xs font-black text-slate-800 border-b pb-2">ثبت تراکنش صرافی</h2>
            <form onsubmit="saveTx(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="txDate" required class="bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                    <select id="txCurr" class="bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                        <option value="USD">دلار (USD)</option>
                        <option value="AFN">افغانی (AFN)</option>
                        <option value="IQD">دینار (IQD)</option>
                        <option value="تومان">تومان</option>
                    </select>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" step="any" id="srcAmt" oninput="calc()" placeholder="مبلغ اولیه" class="bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                    <select id="calcOp" onchange="calc()" class="bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                        <option value="mul">ضرب (×)</option>
                        <option value="div">تقسیم (÷)</option>
                    </select>
                    <input type="number" step="any" id="exRate" oninput="calc()" placeholder="نرخ" class="bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                </div>
                <input type="number" step="any" id="finalAmt" required placeholder="مبلغ نهایی (اصلی)" class="w-full bg-emerald-50 border-2 border-emerald-500 p-2.5 rounded-xl text-xs font-black text-emerald-900">
                <input type="text" id="desc" placeholder="شرح تراکنش..." class="w-full bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                
                <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-xs shadow">ثبت و ذخیره تراکنش</button>
            </form>
        </div>
    </main>

    <!-- مدال صرافی جدید -->
    <div id="brokerModal" class="fixed inset-0 bg-slate-900/70 hidden items-center justify-center p-4 z-50">
        <div class="card-custom bg-white w-full max-w-sm p-5 space-y-3">
            <h3 class="font-black text-xs text-slate-800">افزودن صرافی جدید</h3>
            <form onsubmit="saveBroker(event)" class="space-y-2">
                <input type="text" id="bName" required placeholder="نام صرافی" class="w-full border p-2.5 rounded-xl text-xs font-bold">
                <input type="text" id="bPhone" placeholder="تلفن" class="w-full border p-2.5 rounded-xl text-xs font-bold">
                <input type="text" id="bCity" placeholder="شهر" class="w-full border p-2.5 rounded-xl text-xs font-bold">
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal('brokerModal')" class="w-1/2 bg-slate-200 py-2 rounded-xl text-xs font-bold">انصراف</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 text-white py-2 rounded-xl text-xs font-black">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "mohammadsharifkarimi4@gmail.com";
        const ADMIN_PIN = "77218731";
        const SUPABASE_URL = "https://zpehwbkvtbiceurfpafiw.supabase.co";
        const SUPABASE_KEY = "sb_publishable__ZK44kWZES328UQJ7P_zzw_tZoc465D";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let brokers = [], transactions = [], currentBrokerId = null;

        window.onload = async () => {
            if (sessionStorage.getItem('auth') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
            }
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
            await loadData();
        };

        function doLogin(e) {
            e.preventDefault();
            if (document.getElementById('lEmail').value.trim() === ADMIN_EMAIL && document.getElementById('lPin').value.trim() === ADMIN_PIN) {
                sessionStorage.setItem('auth', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                document.getElementById('lErr').classList.remove('hidden');
            }
        }

        async function loadData() {
            try {
                let [bRes, tRes] = await Promise.all([
                    sb.from('brokers').select('*'),
                    sb.from('broker_transactions').select('*')
                ]);
                brokers = bRes.data || [];
                transactions = tRes.data || [];
                renderBrokers();
            } catch (err) {
                console.error("خطا در اتصال به سوربیس:", err);
            }
        }

        function renderBrokers() {
            let sel = document.getElementById('brokerSelect');
            sel.innerHTML = '';
            if (brokers.length === 0) {
                sel.innerHTML = '<option value="">هیچ صرافی‌ای یافت نشد</option>';
                currentBrokerId = null;
                updateMeta();
                return;
            }
            brokers.forEach(b => {
                let id = b.broker_id || b.id;
                let name = b.broker_name || 'بدون نام';
                sel.innerHTML += `<option value="${id}">${name} (${b.city || ''})</option>`;
            });
            if (!currentBrokerId || !brokers.some(b => String(b.broker_id || b.id) === String(currentBrokerId))) {
                currentBrokerId = brokers[0].broker_id || brokers[0].id;
            }
            sel.value = currentBrokerId;
            updateMeta();
            calcBalances();
        }

        function onBrokerChange() {
            currentBrokerId = document.getElementById('brokerSelect').value;
            updateMeta();
            calcBalances();
        }

        function updateMeta() {
            let b = brokers.find(x => String(x.broker_id || x.id) === String(currentBrokerId));
            document.getElementById('mId').innerText = currentBrokerId || '-';
            document.getElementById('mPhone').innerText = b ? (b.phone || '-') : '-';
            document.getElementById('mCity').innerText = b ? (b.city || '-') : '-';
        }

        function calc() {
            let s = parseFloat(document.getElementById('srcAmt').value) || 0;
            let r = parseFloat(document.getElementById('exRate').value) || 0;
            let op = document.getElementById('calcOp').value;
            if (s > 0 && r > 0) {
                let res = (op === 'mul') ? (s * r) : (s / r);
                document.getElementById('finalAmt').value = res.toFixed(2);
            }
        }

        async function saveBroker(e) {
            e.preventDefault();
            let name = document.getElementById('bName').value;
            let phone = document.getElementById('bPhone').value;
            let city = document.getElementById('bCity').value;
            let randomId = 'BRK-' + Math.floor(1000 + Math.random() * 9000);

            let { data, error } = await sb.from('brokers').insert([{
                broker_id: randomId,
                broker_name: name,
                phone: phone,
                city: city
            }]).select();

            if (error) {
                alert("خطا در ذخیره صرافی: " + error.message);
                return;
            }

            closeModal('brokerModal');
            document.getElementById('bName').value = '';
            document.getElementById('bPhone').value = '';
            document.getElementById('bCity').value = '';
            await loadData();
            if (data && data.length > 0) {
                currentBrokerId = data[0].broker_id || data[0].id;
                document.getElementById('brokerSelect').value = currentBrokerId;
                updateMeta();
            }
            alert("صرافی با موفقیت ثبت شد!");
        }

        async function saveTx(e) {
            e.preventDefault();
            if (!currentBrokerId) return alert("صرافی انتخاب نشده است!");

            let payload = {
                broker_id: String(currentBrokerId),
                tx_date: document.getElementById('txDate').value,
                currency: document.getElementById('txCurr').value,
                source_amount: parseFloat(document.getElementById('srcAmt').value) || null,
                exchange_rate: parseFloat(document.getElementById('exRate').value) || null,
                amount: parseFloat(document.getElementById('finalAmt').value) || 0,
                description: document.getElementById('desc').value
            };

            let { error } = await sb.from('broker_transactions').insert([payload]);
            if (error) {
                alert("خطا در ثبت تراکنش: " + error.message);
                return;
            }

            alert("تراکنش ثبت شد!");
            document.getElementById('srcAmt').value = '';
            document.getElementById('exRate').value = '';
            document.getElementById('finalAmt').value = '';
            document.getElementById('desc').value = '';
            await loadData();
        }

        function calcBalances() {
            let totals = { 'USD': 0, 'AFN': 0, 'IQD': 0, 'تومان': 0 };
            transactions.filter(t => String(t.broker_id) === String(currentBrokerId)).forEach(t => {
                let c = String(t.currency || 'USD').toUpperCase();
                let a = parseFloat(t.amount) || 0;
                if (totals[c] !== undefined) totals[c] += a;
            });
            document.getElementById('bUSD').innerText = totals['USD'].toLocaleString();
            document.getElementById('bAFN').innerText = totals['AFN'].toLocaleString();
            document.getElementById('bIQD').innerText = totals['IQD'].toLocaleString();
            document.getElementById('bTMN').innerText = totals['تومان'].toLocaleString();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.remove('flex'); document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
